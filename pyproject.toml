[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = false

[project]
name = "ai-serv5"
version = "0.1.0"
description = "SkillMatch AI Services"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi[standard]>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.2.1",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "celery>=5.3.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-groq>=0.2.0",
    "langchain-openai>=0.2.0",
    "crewai>=0.1.0",
    "instructor>=1.0.0",
    "openai>=1.0.0",
    "google-api-python-client>=2.100.0",
    "duckduckgo-search>=5.0.0",
    "qdrant-client>=1.19.0",
    "langgraph>=1.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.fastapi]
entrypoint = "src.api.main:app"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
]
ignore = [
    "E501",  # Line too long (handled by formatter)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.pyright]
extraPaths = ["src", "D:/ProgramData/anaconda3/lib/site-packages"]
pythonPath = "D:/ProgramData/anaconda3/python.exe"

[tool.pyrefly]
python-interpreter-path = "D:/ProgramData/anaconda3/python.exe"
search-path = [
    "src",
    "D:/ProgramData/anaconda3/lib/site-packages"
]