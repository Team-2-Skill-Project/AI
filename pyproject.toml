[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
]
ignore = [
    "E501",  # Line too long (handled by formatter)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.pyright]
extraPaths = ["src", "D:/ProgramData/anaconda3/lib/site-packages"]
pythonPath = "D:/ProgramData/anaconda3/python.exe"

[tool.pyrefly]
python-interpreter-path = "D:/ProgramData/anaconda3/python.exe"
search-path = [
    "src",
    "D:/ProgramData/anaconda3/lib/site-packages"
]



