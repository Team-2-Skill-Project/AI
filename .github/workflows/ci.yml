name: AI Service CI

on:
  push:
    branches: [main, master, production]
  pull_request:
    branches: [main, master, production]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Pytest Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Run Pytest test suite
        run: |
          if [ -d "tests" ]; then
            python -m pytest tests/ -v --tb=short
          else
            echo "tests/ directory not present, skipping test step."
          fi
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite://
          REDIS_URL: redis://localhost:6379/0
          LLM_API_KEY: dummy-ci-key
          GEMINI_API_KEY: dummy-ci-key
          GROQ_API_KEY: dummy-ci-key

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Dockerfile build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: skillmatch-ai:ci-check
          cache-from: type=gha
          cache-to: type=gha,mode=max
